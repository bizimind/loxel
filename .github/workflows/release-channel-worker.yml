name: Deploy Channel Worker

on:
  push:
    branches:
      - main
    paths:
      - "packages/channel-worker/**"
      - "packages/channel/src/protocol.ts"
      - ".github/workflows/release-channel-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        run: |
          # Set secrets (wrangler secret put is idempotent)
          echo "$WORKOS_CLIENT_ID" | bunx wrangler secret put WORKOS_CLIENT_ID
          echo "$AXIOM_TOKEN" | bunx wrangler secret put AXIOM_TOKEN
          # Deploy
          bunx wrangler deploy
        working-directory: packages/channel-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
