name: Vulnerability Check

on:
  pull_request:
  push:
    branches: [main]
  # Daily: advisories appear without code changes.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  # By event too, so a push to main does not cancel a scheduled scan.
  group: vuln-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Dependency audit
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Upload SARIF to GitHub Security tab
        if: always() && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF
        if: always() && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-results.sarif

  # The latest Loxel release's SBOMs, under the release gate's rule (see release-loxel.yml and
  # packages/loxel/docs/ELECTRON.md), with main's `.trivyignore`.
  loxel-sbom:
    name: Loxel SBOM audit (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64]
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Download SBOM
        env:
          TARGET: ${{ matrix.target }}
        run: |
          URL=$(curl -fsSL https://loxel.bizimind.io/loxel/manifest.json | jq -er --arg t "$TARGET" '.sbom[$t]')
          echo "Scanning $URL"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/sbom.cdx.json"

      - name: Scan SBOM for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: ${{ runner.temp }}/sbom.cdx.json
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/sbom-vulns.json
          # The action's default Trivy (v0.70.0) cannot decode sbom.ts's CycloneDX 1.7.
          version: v0.76.1
      - name: Gate on SBOM vulnerabilities
        run: bun packages/loxel/scripts/sbom-vuln-gate.ts "$RUNNER_TEMP/sbom-vulns.json"
