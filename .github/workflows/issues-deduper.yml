name: Issues Deduper

on:
  #   schedule:
  #     - cron: "0 6 * * *" # Daily at 6 AM UTC
  workflow_dispatch:

# Sequential processing - only one dedup run at a time
concurrency:
  group: issues-deduper
  cancel-in-progress: false

# Claude reads issue text anyone can write, so it runs in a job with a read-only token and no stored
# git credentials. A second job, which runs no model, checks its results (policy.ts) and acts on them.
jobs:
  analyze:
    name: Check for duplicate issues
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 52
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
      last: ${{ steps.pending.outputs.last }}
    steps:
      # Checkout main branch first (for scripts and setup-claude action)
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: ./.github/actions/setup-claude

      # Checkout issues branch into separate directory
      - name: Checkout issues branch
        uses: actions/checkout@v7
        with:
          ref: issues
          path: issues-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Get issues to process
        id: pending
        working-directory: issues-repo
        run: |
          LAST=$(cat last-processed.txt 2>/dev/null || echo "0")
          echo "Last processed: $LAST"

          # List issue files, extract numbers, filter > LAST, sort numerically
          if ls issues/*.md 1>/dev/null 2>&1; then
            PENDING=$(ls issues/*.md | sed 's/.*\/\([0-9]*\)-.*/\1/' | awk -v last="$LAST" '$1 > last' | sort -n | tr '\n' ' ')
          else
            PENDING=""
          fi

          echo "Pending issues: $PENDING"
          echo "last=$LAST" >> $GITHUB_OUTPUT
          echo "pending=$PENDING" >> $GITHUB_OUTPUT
          if [ -z "$PENDING" ]; then
            echo "No new issues to process." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check each new issue
        if: steps.pending.outputs.pending != ''
        working-directory: issues-repo
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PENDING: ${{ steps.pending.outputs.pending }}
        run: |
          for ISSUE in $PENDING; do
            echo "Checking issue #$ISSUE"
            bun ../.github/scripts/issues-deduper/check-issue.ts "$ISSUE"
          done

      - name: Upload results
        if: steps.pending.outputs.pending != ''
        uses: actions/upload-artifact@v7
        with:
          name: dedupe-results
          path: issues-repo/results/
          retention-days: 1

  act:
    name: Act on results
    needs: analyze
    if: needs.analyze.outputs.pending != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Checkout issues branch
        uses: actions/checkout@v7
        with:
          ref: issues
          path: issues-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          name: dedupe-results
          path: issues-repo/results

      - name: Act on each result
        working-directory: issues-repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PENDING: ${{ needs.analyze.outputs.pending }}
        run: |
          for ISSUE in $PENDING; do
            echo "Processing issue #$ISSUE"
            bun ../.github/scripts/issues-deduper/process-results.ts "$ISSUE"
            echo "$ISSUE" > last-processed.txt
          done

      - name: Commit progress
        working-directory: issues-repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-processed.txt
          git diff --cached --quiet || git commit -m "Update last-processed to $(cat last-processed.txt)"

          # The checkouts keep no credentials; this step alone authenticates its push.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Retry push with rebase on conflict
          for i in 1 2 3; do
            if git push "$remote" HEAD:issues; then
              break
            fi
            echo "Push failed, attempt $i. Pulling and retrying..."
            git pull --rebase "$remote" issues
          done

      - name: Summary
        env:
          PENDING: ${{ needs.analyze.outputs.pending }}
          LAST: ${{ needs.analyze.outputs.last }}
        run: |
          {
            echo "## Issues Deduper Summary"
            echo ""
            echo "Processed issues: $PENDING"
            echo ""
            echo "Last processed before run: $LAST"
          } >> "$GITHUB_STEP_SUMMARY"
