name: Release code-analysis

on:
  push:
    branches: [main]
    paths:
      - "packages/code-analysis/**"
      - ".github/workflows/release-code-analysis.yml"

permissions:
  contents: write

concurrency:
  group: release-code-analysis
  cancel-in-progress: false

jobs:
  build-matrix:
    # Skip if this is a release commit
    if: "!startsWith(github.event.head_commit.message, 'chore(code-analysis): release')"
    uses: ./.github/workflows/build-matrix.yml

  check-and-bump:
    needs: build-matrix
    if: ${{ fromJSON(needs.build-matrix.outputs.platforms)[0] != null }}
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 1
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_CONTENT_WRITE }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Before anything is tagged or uploaded: a release whose manifest cannot be signed, or whose
      # binaries would embed a key that does not verify it, fails here instead of half published.
      - name: Check the manifest signing key pair
        run: bun packages/cli-common/scripts/sign-manifest.ts --check
        env:
          CLI_MANIFEST_SIGNING_KEY: ${{ secrets.CLI_MANIFEST_SIGNING_KEY }}
          CLI_MANIFEST_PUBLIC_KEY: ${{ vars.CLI_MANIFEST_PUBLIC_KEY }}

      - name: Bump patch version
        id: bump
        run: |
          cd packages/code-analysis
          CURRENT=$(jq -r .version package.json)
          NEW_VERSION=$(pnpm dlx semver -i patch "$CURRENT")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=code-analysis-v$NEW_VERSION" >> $GITHUB_OUTPUT

          jq --arg v "$NEW_VERSION" '.version = $v' package.json > tmp.json
          mv tmp.json package.json

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if tag already exists (from a previous failed run)
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.bump.outputs.tag }}$"; then
            echo "::error::Tag ${{ steps.bump.outputs.tag }} already exists. Please delete it manually and re-run."
            exit 1
          fi

          git add packages/code-analysis/package.json
          git commit -m "chore(code-analysis): release v${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"

          # Retry loop for push (handles race with other releases)
          for i in $(seq 1 10); do
            git pull --rebase origin main
            if git push origin main; then
              break
            fi
            if [ $i -eq 10 ]; then
              echo "::error::Failed to push after 10 attempts"
              exit 1
            fi
            echo "Push failed (attempt $i/10), retrying in 3s..."
            sleep 3
          done

          git push origin --tags

  build:
    needs: [build-matrix, check-and-bump]
    strategy:
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    outputs:
      sha256_darwin-arm64: ${{ steps.sha.outputs.sha256_darwin-arm64 }}
      sha256_darwin-x64: ${{ steps.sha.outputs.sha256_darwin-x64 }}
      sha256_linux-x64: ${{ steps.sha.outputs.sha256_linux-x64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-and-bump.outputs.tag }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build binary
        run: pnpm -C packages/code-analysis run build
        env:
          BUN_NO_CODESIGN_MACHO_BINARY: "1"
          # Embedded in the binary, which checks update manifests against it.
          CLI_MANIFEST_PUBLIC_KEY: ${{ vars.CLI_MANIFEST_PUBLIC_KEY }}

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/import-signing-certificate
        with:
          certificate: ${{ secrets.LOXEL_CERTIFICATE }}
          password: ${{ secrets.LOXEL_CERTIFICATE_PWD }}

      # Self-updating CLIs refuse a macOS update without this Developer ID signature.
      - name: Sign binary (macOS)
        if: runner.os == 'macOS'
        run: bun packages/cli-common/scripts/codesign-release.ts packages/code-analysis/dist/code-analysis code-analysis

      - name: Calculate checksum
        id: sha
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            SHA256=$(shasum -a 256 packages/code-analysis/dist/code-analysis | awk '{print $1}')
          else
            SHA256=$(sha256sum packages/code-analysis/dist/code-analysis | awk '{print $1}')
          fi
          echo "sha256_${{ matrix.platform }}=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp packages/code-analysis/dist/code-analysis \
            "s3://loxel/code-analysis/${{ matrix.platform }}/code-analysis" \
            --content-type application/octet-stream

  release:
    needs: [build-matrix, check-and-bump, build]
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-and-bump.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Generate manifest
        run: |
          VERSION="${{ needs.check-and-bump.outputs.version }}"
          PLATFORMS='${{ needs.build-matrix.outputs.platforms }}'
          BASE="https://loxel.bizimind.io/code-analysis"

          jq -n \
            --arg v "$VERSION" \
            --argjson platforms "$PLATFORMS" \
            --arg sha_darwin_arm64 "${{ needs.build.outputs.sha256_darwin-arm64 }}" \
            --arg sha_darwin_x64 "${{ needs.build.outputs.sha256_darwin-x64 }}" \
            --arg sha_linux_x64 "${{ needs.build.outputs.sha256_linux-x64 }}" \
            --arg base "$BASE" \
            '{
              package: "code-analysis",
              version: $v,
              released_at: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
              binaries: {
                "darwin-arm64": {url: "\($base)/darwin-arm64/code-analysis", sha256: $sha_darwin_arm64},
                "darwin-x64": {url: "\($base)/darwin-x64/code-analysis", sha256: $sha_darwin_x64},
                "linux-x64": {url: "\($base)/linux-x64/code-analysis", sha256: $sha_linux_x64}
              } | with_entries(select(.key | IN($platforms[])))
            }' > manifest.json
          cat manifest.json

      # Self-updating CLIs trust a manifest (and the checksums in it) only with this signature.
      - name: Sign manifest
        run: bun packages/cli-common/scripts/sign-manifest.ts manifest.json
        env:
          CLI_MANIFEST_SIGNING_KEY: ${{ secrets.CLI_MANIFEST_SIGNING_KEY }}
          CLI_MANIFEST_PUBLIC_KEY: ${{ vars.CLI_MANIFEST_PUBLIC_KEY }}

      - name: Upload manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp manifest.json.sig s3://loxel/code-analysis/manifest.json.sig --content-type text/plain
          aws s3 cp manifest.json s3://loxel/code-analysis/manifest.json --content-type application/json

      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.check-and-bump.outputs.version }}"
          BASE="https://loxel.bizimind.io/code-analysis"
          PLATFORMS='${{ needs.build-matrix.outputs.platforms }}'

          LINKS=""
          for platform in $(echo "$PLATFORMS" | jq -r '.[]'); do
            LINKS="${LINKS}- [${platform}](${BASE}/${platform}/code-analysis)"$'\n'
          done

          gh release create "${{ needs.check-and-bump.outputs.tag }}" \
            --title "code-analysis ${VERSION}" \
            --generate-notes \
            --notes "## Downloads

          ${LINKS}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
