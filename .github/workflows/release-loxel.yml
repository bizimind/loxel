name: Release loxel

on:
  push:
    branches: [main]
    paths:
      - "packages/loxel/**"
      - ".github/workflows/release-loxel.yml"
  # Manual release for changes outside packages/loxel (e.g. root lockfile/override bumps)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-loxel
  cancel-in-progress: false

jobs:
  check-and-bump:
    # Skip release commits; manual runs only from main (the bump commit is pushed to main)
    if: "github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(loxel): release')"
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 1
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_CONTENT_WRITE }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Before anything is bumped, committed or tagged: a release whose patched Electron isn't in
      # R2 for both architectures would fail later and leave an orphaned release commit and tag.
      - name: Check patched Electron is uploaded
        run: bun packages/loxel/scripts/fetch-electron.ts --check
        env:
          R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
          R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bump patch version
        id: bump
        run: |
          cd packages/loxel
          CURRENT=$(jq -r .version package.json)
          NEW_VERSION=$(pnpm dlx semver -i patch "$CURRENT")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=loxel-v$NEW_VERSION" >> $GITHUB_OUTPUT

          jq --arg v "$NEW_VERSION" '.version = $v' package.json > tmp.json
          mv tmp.json package.json

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if tag already exists (from a previous failed run)
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.bump.outputs.tag }}$"; then
            echo "::error::Tag ${{ steps.bump.outputs.tag }} already exists. Please delete it manually and re-run."
            exit 1
          fi

          git add packages/loxel/package.json
          git commit -m "chore(loxel): release v${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"

          # Retry loop for push (handles race with other releases)
          for i in $(seq 1 10); do
            git pull --rebase origin main
            if git push origin main; then
              break
            fi
            if [ $i -eq 10 ]; then
              echo "::error::Failed to push after 10 attempts"
              exit 1
            fi
            echo "Push failed (attempt $i/10), retrying in 3s..."
            sleep 3
          done

          git push origin --tags

  # Build the signed and notarized app (macOS only). The dmg is the download; the zip is what the
  # installed app's updater downloads, with its block map for downloading only what changed.
  build-electron:
    needs: check-and-bump
    strategy:
      matrix:
        # Each on its own architecture: `bun build --compile`, the language server downloads and the
        # Go builds all produce binaries for the machine they run on.
        include:
          - os: blacksmith-6vcpu-macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    outputs:
      sha256_dmg_arm64: ${{ steps.sha.outputs.sha256_dmg_arm64 }}
      sha256_dmg_x64: ${{ steps.sha.outputs.sha256_dmg_x64 }}
      sha512_zip_arm64: ${{ steps.sha.outputs.sha512_zip_arm64 }}
      sha512_zip_x64: ${{ steps.sha.outputs.sha512_zip_x64 }}
      size_zip_arm64: ${{ steps.sha.outputs.size_zip_arm64 }}
      size_zip_x64: ${{ steps.sha.outputs.size_zip_x64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-and-bump.outputs.tag }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server standalone
        run: pnpm -C packages/loxel run build:server:standalone
        env:
          BUN_NO_CODESIGN_MACHO_BINARY: "1"

      - name: Import signing certificate
        run: |
          echo "$LOXEL_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "temp" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp" build.keychain
          security import certificate.p12 -k build.keychain -P "$LOXEL_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp" build.keychain
        env:
          LOXEL_CERTIFICATE: ${{ secrets.LOXEL_CERTIFICATE }}
          LOXEL_CERTIFICATE_PWD: ${{ secrets.LOXEL_CERTIFICATE_PWD }}

      - name: Decode Apple API key
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > /tmp/AuthKey.p8
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}

      # The keychain-access-groups entitlement (passkeys) is only honoured when a
      # Developer ID provisioning profile granting it is embedded in the bundle;
      # without one macOS refuses to launch the app, so fail here instead.
      - name: Decode provisioning profile
        run: |
          if [ -z "$LOXEL_PROVISIONING_PROFILE_BASE64" ]; then
            echo "LOXEL_PROVISIONING_PROFILE secret is not set" >&2
            exit 1
          fi
          echo "$LOXEL_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/loxel.provisionprofile
          security cms -D -i /tmp/loxel.provisionprofile -o /tmp/loxel.profile.plist
          # The entitlements file is the one source of truth for the identifier.
          EXPECTED_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.application-identifier' \
            packages/loxel/assets/entitlements.mac.plist)
          TEAM_ID=${EXPECTED_APP_ID%%.*}
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' /tmp/loxel.profile.plist)
          if [ "$APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "Provisioning profile is for '$APP_ID', expected $EXPECTED_APP_ID" >&2
            exit 1
          fi
          # Only present when Keychain Sharing was enabled on the App ID before the
          # profile was generated; the app carries the entitlement either way.
          if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:keychain-access-groups' /tmp/loxel.profile.plist \
            | grep -q "$TEAM_ID\."; then
            echo "Provisioning profile does not grant keychain-access-groups; enable Keychain Sharing on the App ID" >&2
            exit 1
          fi
        env:
          LOXEL_PROVISIONING_PROFILE_BASE64: ${{ secrets.LOXEL_PROVISIONING_PROFILE }}

      # Loxel ships a patched Electron (packages/loxel/electron/), built on a Mac and uploaded to R2
      # ahead of time; this fails when the pinned build was never uploaded, rather than packaging
      # stock Electron. See packages/loxel/docs/PATCHED_ELECTRON.md.
      - name: Fetch patched Electron
        run: bun packages/loxel/scripts/fetch-electron.ts ${{ matrix.arch }}
        env:
          R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
          R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Electron app
        run: |
          cd packages/loxel
          ELECTRON=1 pnpm exec vite build
          pnpm exec electron-builder --mac --${{ matrix.arch }} \
            --config.electronDist=build/electron-dist \
            --config.mac.provisioningProfile=/tmp/loxel.provisionprofile
        env:
          CSC_LINK: ${{ secrets.LOXEL_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.LOXEL_CERTIFICATE_PWD }}
          APPLE_API_KEY: /tmp/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Check binary architectures
        run: bun packages/loxel/scripts/check-binary-arch.ts darwin-${{ matrix.arch }} packages/loxel/release

      # electron-updater reads its cache folder from this file on every download.
      - name: Check the updater config is packaged
        run: ls packages/loxel/release/mac*/Loxel.app/Contents/Resources/app-update.yml

      - name: Calculate checksums
        id: sha
        run: |
          ARCH="${{ matrix.arch }}"
          DMG=$(ls packages/loxel/release/*.dmg)
          ZIP=$(ls packages/loxel/release/*.zip)
          {
            echo "sha256_dmg_${ARCH}=$(shasum -a 256 "$DMG" | awk '{print $1}')"
            # electron-updater checks the downloaded zip against a base64 SHA-512
            echo "sha512_zip_${ARCH}=$(openssl dgst -sha512 -binary "$ZIP" | base64 | tr -d '\n')"
            echo "size_zip_${ARCH}=$(stat -f %z "$ZIP")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          for f in packages/loxel/release/*.dmg packages/loxel/release/*.zip packages/loxel/release/*.zip.blockmap; do
            FILENAME=$(basename "$f")
            aws s3 cp "$f" \
              "s3://loxel/loxel/app/darwin-${{ matrix.arch }}/$FILENAME" \
              --content-type application/octet-stream
          done

  release:
    needs: [check-and-bump, build-electron]
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-and-bump.outputs.tag }}

      - name: Generate manifest
        run: |
          VERSION="${{ needs.check-and-bump.outputs.version }}"
          BASE="https://loxel.bizimind.io/loxel"

          # `app` holds the installers the site links to; `update` the zips the app updates from.
          jq -n \
            --arg v "$VERSION" \
            --arg base "$BASE" \
            --arg dmg_sha_arm64 "${{ needs.build-electron.outputs.sha256_dmg_arm64 }}" \
            --arg dmg_sha_x64 "${{ needs.build-electron.outputs.sha256_dmg_x64 }}" \
            --arg zip_sha_arm64 "${{ needs.build-electron.outputs.sha512_zip_arm64 }}" \
            --arg zip_sha_x64 "${{ needs.build-electron.outputs.sha512_zip_x64 }}" \
            --argjson zip_size_arm64 "${{ needs.build-electron.outputs.size_zip_arm64 }}" \
            --argjson zip_size_x64 "${{ needs.build-electron.outputs.size_zip_x64 }}" \
            '{
              version: $v,
              released_at: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
              app: {
                "darwin-arm64": {url: "\($base)/app/darwin-arm64/Loxel-\($v)-mac-arm64.dmg", sha256: $dmg_sha_arm64},
                "darwin-x64": {url: "\($base)/app/darwin-x64/Loxel-\($v)-mac-x64.dmg", sha256: $dmg_sha_x64}
              },
              update: {
                "darwin-arm64": {url: "\($base)/app/darwin-arm64/Loxel-\($v)-mac-arm64.zip", sha512: $zip_sha_arm64, size: $zip_size_arm64},
                "darwin-x64": {url: "\($base)/app/darwin-x64/Loxel-\($v)-mac-x64.zip", sha512: $zip_sha_x64, size: $zip_size_x64}
              }
            }' > manifest.json
          cat manifest.json

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp manifest.json s3://loxel/loxel/manifest.json --content-type application/json

      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.check-and-bump.outputs.version }}"
          BASE="https://loxel.bizimind.io/loxel"

          LINKS="- [macOS arm64](${BASE}/app/darwin-arm64/Loxel-${VERSION}-mac-arm64.dmg)"$'\n'
          LINKS="${LINKS}- [macOS x64](${BASE}/app/darwin-x64/Loxel-${VERSION}-mac-x64.dmg)"$'\n'

          gh release create "${{ needs.check-and-bump.outputs.tag }}" \
            --title "loxel ${VERSION}" \
            --generate-notes \
            --notes "## Downloads

          ${LINKS}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The site reads the manifest at build time, so rebuild it to show the new version.
  # Separate job so a failed dispatch can be re-run without re-running the release.
  redeploy-site:
    needs: release
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 1
    permissions:
      actions: write
    steps:
      - name: Dispatch site deploy
        run: gh workflow run release-site.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
