name: Cleanup site previews

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  contents: read

jobs:
  cleanup:
    # Fork PRs get no repository secrets on pull_request, so the Cloudflare cleanup would fail with an empty token.
    # Dependabot's runs get none either, and its branches never deploy a preview (release-site.yml).
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        !startsWith(github.event.pull_request.head.ref, 'dependabot/')) ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch' &&
        !startsWith(github.event.ref, 'dependabot/'))
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Delete preview deployments
        env:
          BRANCH_PR: ${{ github.event.pull_request.head.ref }}
          BRANCH_DELETE: ${{ github.event.ref }}
          EVENT_NAME: ${{ github.event_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$BRANCH_PR"
          else
            BRANCH="$BRANCH_DELETE"
          fi

          if [ "$BRANCH" = "main" ]; then
            echo "Skipping cleanup for main branch"
            exit 0
          fi

          echo "Cleaning up preview deployments for branch: $BRANCH"

          IDS=$(pnpm dlx wrangler pages deployment list --project-name loxel --json | \
            jq -r --arg branch "$BRANCH" \
            '.[] | select(.deployment_trigger.metadata.branch == $branch) | .id')

          COUNT=0
          for ID in $IDS; do
            echo "Deleting deployment: $ID"
            pnpm dlx wrangler pages deployment delete "$ID" --project-name loxel --force
            COUNT=$((COUNT + 1))
          done

          echo "Deleted $COUNT preview deployment(s) for branch: $BRANCH"
