name: Issues Sync

on:
  issues:
    types: [opened]

# Prevent concurrent syncs that could conflict on git push
concurrency:
  group: issues-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync issue to issues branch
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 1
    permissions:
      contents: write
    steps:
      - name: Checkout issues branch
        uses: actions/checkout@v7
        with:
          ref: issues
          fetch-depth: 1

      # Read the runtime pin and script from main; the issues branch is data-only.
      - name: Checkout scripts from main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main-scripts
          sparse-checkout: |
            .bun-version
            .github/scripts/issues-sync
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: main-scripts/.bun-version

      - name: Add issue file
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
          ISSUE_CREATED: ${{ github.event.issue.created_at }}
        run: bun main-scripts/.github/scripts/issues-sync/add-issue.ts

      - name: Commit and push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add issues/
          git commit -m "Add issue #${ISSUE_NUMBER}"

          # Retry push with rebase on conflict
          for i in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push failed, attempt $i. Pulling and retrying..."
            git pull --rebase
          done
