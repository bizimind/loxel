name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time. A push during a review queues the next run (a newer push replaces
# the queued one) instead of cancelling: the running review hears about the new head from its
# Monitor watch, and the queued run resumes the same session, or skips if that head was reviewed.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Only PRs whose branch lives in this repo, which takes write access to push. The review runs
    # with secrets and trusts the PR's own CLAUDE.md, .claude, skills and scripts, so it never runs
    # for forks or for Dependabot (whose runs get Dependabot's secrets, not ours).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.state == 'open' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 56
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Bump by hand: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
      CLAUDE_CODE_VERSION: 2.1.310

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      # The storage credentials are only given to the prepare and save steps, never to Claude.
      - name: Prepare review session
        id: session
        env:
          # Private R2 bucket for review sessions; storage is skipped while its secrets are unset.
          STORE: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID && secrets.CLOUDFLARE_ACCOUNT_ID && format('s3://loxel-ci-private/review-sessions/pr-{0}', github.event.pull_request.number) || '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/claude-review/session.sh prepare

      - name: Install Claude Code
        if: steps.session.outputs.mode != 'skip'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      # Claude's output goes to a file in the runner's temp directory, never to the public log.
      # `claude -p` exits only when the review, its background agents and its watches are done.
      - name: Run Claude Code Review
        id: claude-review
        if: steps.session.outputs.mode != 'skip'
        # Fails a hung review (e.g. a watch never stopped) while leaving time to save the session.
        timeout-minutes: 50
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ steps.session.outputs.prompt }}
          SESSION_ARGS: ${{ steps.session.outputs.claude_args }}
          # Keep waiting on background agents through long review steps (the default is 10 idle minutes).
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "1800000"
          # Keep the pinned version for the whole run.
          DISABLE_AUTOUPDATER: "1"
        run: |
          # shellcheck disable=SC2086 # SESSION_ARGS is a flag and its value
          claude -p "$PROMPT" --model 'claude-opus-5[1m]' $SESSION_ARGS \
            --allowedTools 'Read,Edit,Write,Bash,Grep,Glob,WebFetch,WebSearch,Agent,SendMessage,TodoWrite,TaskCreate,TaskGet,TaskList,TaskUpdate,TaskStop,Monitor,Skill' \
            --output-format stream-json --verbose >"$RUNNER_TEMP/claude-output.jsonl" 2>"$RUNNER_TEMP/claude-stderr.log"

      - name: Save review session
        if: always() && steps.session.outputs.mode != '' && steps.session.outputs.mode != 'skip'
        env:
          STORE: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID && secrets.CLOUDFLARE_ACCOUNT_ID && format('s3://loxel-ci-private/review-sessions/pr-{0}', github.event.pull_request.number) || '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.session.outputs.mode }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          OUTCOME: ${{ steps.claude-review.outcome }}
        run: .github/scripts/claude-review/session.sh save
