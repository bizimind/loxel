name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Fork PRs get no repository secrets on pull_request, so the review would fail with an empty token.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.state == 'open' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 56
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1.0.244
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-opus-5[1m]
            --allowedTools 'Read,Edit,Write,Bash,Grep,Glob,WebFetch,WebSearch,Agent,SendMessage,TodoWrite,TaskCreate,TaskGet,TaskList,TaskUpdate,TaskOutput,Skill'
          show_full_output: true
          prompt: "/code-review Code review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
