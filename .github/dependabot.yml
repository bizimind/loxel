version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        versions: [">= 25"]
    groups:
      # New lint rules usually need a code commit before oxlint merges, so it gets its own PR instead
      # of holding back every other bump. oxfmt stays ungrouped: a formatter bump is reviewed alone.
      oxlint:
        patterns: ["oxlint*"]
        update-types: ["minor", "patch"]
      all-non-major:
        patterns: ["*"]
        exclude-patterns: ["oxlint*", "oxfmt"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
