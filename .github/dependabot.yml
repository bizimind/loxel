version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        versions: [">= 25"]
      # Releases package a patched build of the exact Electron version (packages/loxel/electron/),
      # which has to be built and uploaded before the bump merges; a Dependabot bump would pass CI
      # and then fail the release. See packages/loxel/docs/PATCHED_ELECTRON.md.
      - dependency-name: "electron"
    groups:
      # New lint rules usually need a code commit before oxlint merges, so it gets its own PR instead
      # of holding back every other bump. oxfmt stays ungrouped: a formatter bump is reviewed alone.
      oxlint:
        patterns: ["oxlint*"]
        update-types: ["minor", "patch"]
      all-non-major:
        patterns: ["*"]
        exclude-patterns: ["oxlint*", "oxfmt"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # The modules gopls and docker-language-server are built from (packages/loxel/scripts/*-module/).
  # Every requirement there but the server is indirect, so `allow` has to include indirect ones.
  # The servers themselves are pinned in their language server manifests too, so their own bumps
  # stay manual; the Go toolchain they build with is GO_VERSION in scripts/go-toolchain.ts.
  - package-ecosystem: gomod
    directories:
      - /packages/loxel/scripts/gopls-module
      - /packages/loxel/scripts/docker-lsp-module
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: golang.org/x/tools/gopls
      - dependency-name: github.com/docker/docker-language-server
    groups:
      # Without `group-by`, a group gets one pull request per directory: one per server.
      go-modules:
        patterns: ["*"]
