version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        versions: [">= 25"]
      # Releases package a patched build of the exact Electron version (packages/loxel/electron/),
      # which has to be built and uploaded before the bump merges; a Dependabot bump would pass CI
      # and then fail the release. See packages/loxel/docs/PATCHED_ELECTRON.md.
      - dependency-name: "electron"
    groups:
      # New lint rules usually need a code commit before oxlint merges, so it gets its own PR instead
      # of holding back every other bump. oxfmt stays ungrouped: a formatter bump is reviewed alone.
      oxlint:
        patterns: ["oxlint*"]
        update-types: ["minor", "patch"]
      all-non-major:
        patterns: ["*"]
        exclude-patterns: ["oxlint*", "oxfmt"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # The modules gopls and docker-language-server are built from (packages/loxel/scripts/*-module/),
  # one entry and so one pull request each. Every requirement there but the server is indirect, so
  # `allow` has to include indirect ones. Upgrading a server is a deliberate step (see its build
  # script), and so are major versions, which change APIs the server's own code calls.
  - package-ecosystem: gomod
    directory: /packages/loxel/scripts/gopls-module
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # gopls compiles against golang.org/x/tools internals at the commit its release pins, and each
      # golang.org/x module's new release requires the others' latest, so they move only with gopls.
      - dependency-name: golang.org/x/*
    groups:
      gopls-module:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /packages/loxel/scripts/docker-lsp-module
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: github.com/docker/docker-language-server
    groups:
      docker-lsp-module:
        patterns: ["*"]
