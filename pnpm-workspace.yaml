packages:
  - "packages/*"

catalog:
  # The root's typechecker and the tsc Loxel ships (packages/loxel/scripts/copy-typescript.ts).
  "@typescript/native": npm:typescript@7.1.0-dev.20261117.1

# Delay newly published versions to reduce supply-chain risk. The pnpm this repo requires also checks
# every entry of an existing lockfile against this window, so `pnpm install --frozen-lockfile` in CI
# rejects a lockfile that carries a too-new version, transitive ones included; pnpm 10 skipped that
# check. The root package.json's `engines.pnpm` makes older pnpm refuse to run, and makes Dependabot
# update the lockfile with pnpm 12, which drops a version-update bump that would add a version inside
# the window (a security update may still add one, and CI then rejects it). CI's `pnpm/action-setup`
# steps install pnpm 12 for the same reason.
minimumReleaseAge: 10080
# A version whose registry metadata has no publish time fails the check instead of passing it.
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Loxel ships a patched build of this Electron release (packages/loxel/electron/); 45.3.0 carries
  # Chromium security fixes and was published 2026-11-10. Drop once it is a week old.
  - "electron@45.3.0"
  # Loxel ships this nightly's tsc as its TypeScript language server: built with Go 1.27.4 and
  # golang.org/x/text 0.43.0, it carries the Go standard library fixes 7.0.2's tsc (Go 1.26.4) lacks.
  # Published 2026-11-17. Drop once it is a week old.
  - "typescript@7.1.0-dev.20261117.1"
  - "@typescript/typescript-darwin-arm64@7.1.0-dev.20261117.1"
  - "@typescript/typescript-darwin-x64@7.1.0-dev.20261117.1"
  - "@typescript/typescript-linux-arm@7.1.0-dev.20261117.1"
  - "@typescript/typescript-linux-arm64@7.1.0-dev.20261117.1"
  - "@typescript/typescript-linux-x64@7.1.0-dev.20261117.1"
  - "@typescript/typescript-win32-arm64@7.1.0-dev.20261117.1"
  - "@typescript/typescript-win32-x64@7.1.0-dev.20261117.1"

overrides:
  # sass is a build-time tool mislisted as a runtime dep; drops chokidar@3 -> braces (CVE-2026-93687)
  "@excalidraw/excalidraw>sass": "-"
  # 0.18.1 pins 2.2.2, which pulls a second mermaid (11) into Loxel's renderer next to its own 12. 3.x has
  # the same parseMermaidToExcalidraw API and no mermaid dependency. Drop once excalidraw ships with 3.x.
  "@excalidraw/excalidraw>@excalidraw/mermaid-to-excalidraw": "^3.6.0"
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  devalue: "^5.9.4"
  "dompurify@<3.4.17": "3.4.17"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  # GHSA-ch52-4w7c-c8xp lists no patched version, but its range is <=4.2.0
  "http-cache-semantics@<=4.2.0": "4.3.0"
  js-yaml: "4.3.2"
  # mermaid 11 (the excalidraw CLI's) and micromark-extension-math pin katex ^0.16; 0.18.2 fixes GHSA-238p-pmpm-9mq7 (0.18.4 matches milkdown)
  "katex@<0.18.2": "0.18.4"
  lodash-es: ">=4.18.0"
  "mermaid@<11.16.1": "11.16.1"
  # GHSA-g3hv-75wg-m249 has no fix below 11. app-builder-lib (^10.2.5, electron-builder's file
  # filters) and @electron/universal 2.0.3 (^9) have no release on 11 yet; both use only the
  # Minimatch class, minimatch() and Minimatch#set, which 11 keeps. Drop once they depend on >= 11.0.1.
  "minimatch@>=7.0.0 <11.0.1": "11.0.5"
  "nanoid@<3.3.16": "3.3.18"
  "nanoid@>=4.0.0 <5.1.16": "5.1.16"
  postcss: "8.5.26"
  # @tailwindcss/typography pins 6.0.10 exactly; 7.1.6 fixes GHSA-rj75-hqrm-r3gf
  "postcss-selector-parser@<7.1.6": "7.1.6"
  sharp: "0.35.5"
  "smol-toml@<1.9.0": "1.9.0"
  svgo: "4.1.0"
  "tar@<=7.5.20": "7.5.22"
  "undici@>=6.0.0 <6.29.1": "6.29.1"
  "undici@>=7.0.0 <7.30.1": "7.30.1"
  "undici@>=8.0.0 <8.12.2": "8.12.2"
  "ws@>=8.0.0 <8.21.0": "8.21.3"

allowBuilds:
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
