  "@ai-sdk/provider-utils@>=4.0.0 <4.0.33": "4.0.33"
  devalue: ">=5.8.1"
  "dompurify@<3.4.14": "3.4.14"
  immutable: "4.3.9"
  js-yaml: "4.3.2"
  lodash-es: ">=4.18.0"
  "mermaid@<11.16.1": "11.16.1"
  "nanoid@<3.3.16": "3.3.18"
  "nanoid@>=4.0.0 <5.1.16": "5.1.16"
  postcss: "8.5.26"
  sharp: "0.35.4"
  "smol-toml@<=1.7.0": "1.7.1"
