packages:
  - "packages/*"

# Delay newly published versions to reduce supply-chain risk.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "nanoid@3.3.18"
  - "nanoid@5.1.16"
  - "postcss@8.5.26"
  # Dependabot's electron bump (#618) landed inside the 7-day window; drop once 44.9.1 is a week old.
  - "electron@44.9.1"
  # fast-uri 3.1.9 (Dependabot alerts #162-#165) was published 2026-10-19; drop once it is a week old.
  - "fast-uri@3.1.9"
  # happy-dom 21.0.4 (Dependabot alert #166) was published 2026-10-20; drop once it is a week old.
  - "@happy-dom/global-registrator@21.0.4"
  - "happy-dom@21.0.4"

overrides:
  # sass is a build-time tool mislisted as a runtime dep; drops chokidar@3 -> braces (CVE-2026-93687)
  "@excalidraw/excalidraw>sass": "-"
  "@ai-sdk/provider-utils@>=4.0.0 <4.0.33": "4.0.33"
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  devalue: "^5.9.4"
  "dompurify@<3.4.17": "3.4.17"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  # GHSA-ch52-4w7c-c8xp lists no patched version, but its range is <=4.2.0
  "http-cache-semantics@<=4.2.0": "4.3.0"
  js-yaml: "4.3.2"
  # mermaid and micromark-extension-math pin katex ^0.16; 0.18.2 fixes GHSA-238p-pmpm-9mq7 (0.18.4 matches milkdown)
  "katex@<0.18.2": "0.18.4"
  lodash-es: ">=4.18.0"
  "mermaid@<11.16.1": "11.16.1"
  "nanoid@<3.3.16": "3.3.18"
  "nanoid@>=4.0.0 <5.1.16": "5.1.16"
  postcss: "8.5.26"
  # @tailwindcss/typography pins 6.0.10 exactly; 7.1.6 fixes GHSA-rj75-hqrm-r3gf
  "postcss-selector-parser@<7.1.6": "7.1.6"
  sharp: "0.35.5"
  "smol-toml@<1.9.0": "1.9.0"
  svgo: "4.1.0"
  "tar@<=7.5.20": "7.5.22"
  "undici@>=6.0.0 <6.29.1": "6.29.1"
  "undici@>=7.0.0 <7.30.1": "7.30.1"
  "undici@>=8.0.0 <8.12.2": "8.12.2"
  "ws@>=8.0.0 <8.21.0": "8.21.3"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  workerd: true
