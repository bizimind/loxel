appId: com.bizimind.loxel
productName: Loxel
copyright: Copyright © 2025

directories:
  output: release
  buildResources: assets

files:
  - dist-electron/**/*
  - "!node_modules/**/*"

extraResources:
  - from: build/loxel-server
    to: loxel-server
  # Every language server's files, staged from scripts/language-servers/*.json
  - from: build/language-servers
    to: .
  - from: dist-electron/renderer
    to: renderer
  # build/THIRD_PARTY_NOTICES.txt is generated by the build:notices script; on macOS electron-builder
  # drops Electron's own Chromium license list, which build-app.ts makes sure is installed, so
  # package through that script
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html

asar: true

generateUpdatesFilesForAllChannels: false

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  # electron-builder would pick this file up from buildResources on its own; it is
  # named here because it carries restricted entitlements (passkeys) that release
  # builds must back with --config.mac.provisioningProfile (see release-loxel.yml).
  entitlements: assets/entitlements.mac.plist
  # Offer Loxel in Finder's "Open With" for text and source files and Excalidraw drawings, and let
  # them and folders be dropped on the Dock icon or opened with `open -a Loxel`. Alternate rank:
  # Loxel never becomes a type's default app unless the user picks it with "Change All…".
  # src/electron/main.ts handles the opens.
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Text Document
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        # Plain text, Markdown, JSON, YAML, XML, HTML, CSS, scripts and the source code macOS knows
        LSItemContentTypes: [public.text]
      - CFBundleTypeName: Source Code
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        # Extensions macOS may have no text type for: Markdown and YAML have one only when an
        # installed app declares it, and .ts is MPEG transport stream to macOS
        CFBundleTypeExtensions:
          - md
          - markdown
          - yml
          - yaml
          - mjs
          - cjs
          - ts
          - tsx
          - mts
          - cts
          - jsx
          - mdx
          - vue
          - svelte
          - astro
          - toml
          - tf
          - tfvars
          - hcl
          - graphql
          - gql
          - prisma
          - proto
          - go
          - rs
          - kt
          - kts
          - dart
          - zig
          - lua
          - lock
      - CFBundleTypeName: Excalidraw Drawing
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        CFBundleTypeExtensions: [excalidraw]
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes: [public.folder]
  # No arch lists: they would override --x64 or --arm64 and package the other architecture with
  # this machine's binaries.
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
